services:
  mariadb:
    image: mariadb:11.4
    container_name: chatting-mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-chatting}
      MARIADB_USER: ${DB_USER:-chatting}
      MARIADB_PASSWORD: ${DB_PASSWORD:-chatting}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: chatting-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Linux에서도 host.docker.internal로 호스트의 앱(3000)에 접근한다.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  mariadb-data:
  prometheus-data:
