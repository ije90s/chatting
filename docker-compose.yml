services:
  mariadb:
    image: mariadb:11.4
    container_name: chatting-mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-chatting}
      MARIADB_USER: ${DB_USER:-chatting}
      MARIADB_PASSWORD: ${DB_PASSWORD:-chatting}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
